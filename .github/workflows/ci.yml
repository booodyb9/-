name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Package deploy source
        if: success()
        run: |
          mkdir -p deploy-source
          rsync -a --exclude node_modules --exclude .git --exclude deploy-source ./ deploy-source/

      - name: Upload deploy source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-source
          path: deploy-source
          include-hidden-files: true
          retention-days: 1
