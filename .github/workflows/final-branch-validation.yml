name: Final branch validation

on:
  push:
    branches:
      - agent/project-device-uploads

permissions:
  contents: write

jobs:
  validate-final-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-device-uploads
          fetch-depth: 0

      - name: Apply final cleanup batch
        run: python scripts/final-batch-cleanup.py

      - name: Restore stable npm lockfile
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json

      - name: Remove temporary validation files
        run: |
          rm -f scripts/final-batch-cleanup.py
          rm -f .github/workflows/final-branch-validation.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build validation
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit validated branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize dashboard performance SEO cleanup"
          git push origin HEAD:agent/project-device-uploads
