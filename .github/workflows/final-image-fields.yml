name: Final device image fields

on:
  push:
    branches:
      - agent/project-device-uploads

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-device-uploads
          fetch-depth: 0

      - name: Apply final device-only image fields
        run: python scripts/final-image-fields.py

      - name: Remove temporary migration files
        run: |
          rm -f scripts/final-image-fields.py
          rm -f .github/workflows/final-image-fields.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Production build validation
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit validated image field changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make remaining dashboard images device-only"
          git push origin HEAD:agent/project-device-uploads
