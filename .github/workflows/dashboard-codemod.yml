name: Dashboard full CRUD codemod

on:
  push:
    branches:
      - agent/dashboard-full-crud

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-full-crud

      - name: Apply dashboard codemod
        run: python scripts/dashboard_full_crud_codemod.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit generated dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enable device uploads and full image CRUD across dashboard"
          git push origin HEAD:agent/dashboard-full-crud
