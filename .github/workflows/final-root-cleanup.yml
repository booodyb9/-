name: Final root cleanup

on:
  push:
    branches:
      - agent/project-device-uploads

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-device-uploads
          fetch-depth: 0

      - name: Remove remaining obsolete artifacts
        run: python scripts/final-root-cleanup.py

      - name: Restore package lock from stable main
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json

      - name: Remove temporary cleanup files
        run: |
          rm -f scripts/final-root-cleanup.py
          rm -f .github/workflows/final-root-cleanup.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without changing lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Production build validation
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish repository cleanup"
          git push origin HEAD:agent/project-device-uploads
