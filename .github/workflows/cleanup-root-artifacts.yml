name: Cleanup root artifacts

on:
  push:
    branches:
      - agent/project-device-uploads

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-device-uploads

      - name: Remove temporary root artifacts
        run: python scripts/cleanup-root-artifacts.py

      - name: Remove temporary cleanup files
        run: |
          rm -f scripts/cleanup-root-artifacts.py
          rm -f .github/workflows/cleanup-root-artifacts.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Production build validation
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete patch and test artifacts"
          git push origin HEAD:agent/project-device-uploads
